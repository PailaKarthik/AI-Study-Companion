# Render Blueprint — AI Study Companion (free-tier friendly)
#
# Deploy as a Blueprint (render.com → New → Blueprint → point at this repo).
# Set ALL secrets in the Render dashboard (Environment tab per service) —
# never commit values here. See docs/DEPLOYMENT.md §14 for the 512 MB
# budget rules (one service per instance, heap cap, worker concurrency 1–2).

services:
  # ---------------------------------------------------------------- API --
  - type: web
    name: aistudy-api
    runtime: node
    plan: free
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @ai-study-companion/db generate &&
      pnpm --filter @ai-study-companion/db migrate:deploy &&
      pnpm --filter @ai-study-companion/api build
    startCommand: NODE_OPTIONS=--max-old-space-size=384 node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        value: https://YOUR-WEB-APP-URL
      - key: API_URL
        value: https://YOUR-API-URL
      - key: API_CORS_ORIGIN
        value: https://YOUR-WEB-APP-URL
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: neon
      - key: STORAGE_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: SENTRY_DSN
        sync: false

  # --------------------------------------------------------------- Worker --
  - type: worker
    name: aistudy-worker
    runtime: node
    plan: free
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @ai-study-companion/db generate &&
      pnpm --filter @ai-study-companion/worker build
    startCommand: NODE_OPTIONS=--max-old-space-size=384 node apps/worker/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 1
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: neon
      - key: STORAGE_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: SENTRY_DSN
        sync: false
